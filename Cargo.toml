[workspace]
resolver = "2"
members = [
    "lancer-sqlmap",
    "sqlmap-core",
    "sqlmap-payloads",
    "sqlmap-techniques",
    "sqlmap-tamper",
    "sqlmap-dbms",
    "sqlmap-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
repository = "https://github.com/NHTanvir/lancer-sqlmap"
description = "Rust clone of sqlmap — part of the Lancer bug bounty toolkit"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }

tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "gzip", "deflate", "brotli", "http2", "socks"] }
hyper = { version = "1", features = ["full"] }
h2 = "0.4"
rustls = "0.23"
webpki-roots = "0.26"
cookie_store = "0.21"
httparse = "1.9"
url = "2.5"

governor = "0.6"
crossbeam = "0.8"
crossbeam-channel = "0.5"
rayon = "1.11"
parking_lot = "0.12"
dashmap = "6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

redb = "2"

base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"
hmac = "0.12"

regex = "1.10"
once_cell = "1.20"
lazy_static = "1.5"

strsim = "0.11"

scraper = "0.20"
quick-xml = { version = "0.36", features = ["serialize"] }

eyre = "0.6"
color-eyre = "0.6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

indicatif = "0.17"
comfy-table = "7"
ratatui = "0.28"
crossterm = "0.28"

eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
egui_plot = "0.28"
rfd = "0.14"
directories = "5"
arboard = "3"
egui-notify = "0.15"

mlua = { version = "0.10", features = ["lua54", "vendored"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
bytes = "1"
percent-encoding = "2"
urlencoding = "2"

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

oauth2 = "4.4"
async-graphql-parser = "7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
